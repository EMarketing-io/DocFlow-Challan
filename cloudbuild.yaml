steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/docflow-repo/backend:$COMMIT_SHA'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/docflow-repo/backend:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'docflow-backend'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/docflow-repo/backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/docflow-repo/backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
